[project]
name = "smart-test-platform"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "apscheduler>=3.11.0",
    "deepagents>=0.7.9",
    "fastapi>=0.136.1",
    "fastmcp>=3.1.1",
    "httpx>=0.28.1",
    "langchain>=1.2.0",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-pymupdf4llm>=0.1.0",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.4.15",
    "Levenshtein",
    "lightrag-hku[api]>=1.5.6",
    "openpyxl>=3.1.0",
    "pytest>=8.3.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.49",
    "tzdata>=2026.2",
    "uvicorn>=0.46.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26",
    "reportlab>=4.4",
]

[tool.pytest.ini_options]
# 只收集 tests/：src/ 下 test_case.py、test_case_repo.py 等生产模块文件名
# 匹配 test_*.py，被 pytest 当测试导入会在同一进程重复定义 SQLAlchemy 表
testpaths = ["tests"]
