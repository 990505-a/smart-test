# Web-UI 智能体冒烟集：1 条用例，先确认「agent → playwright runner」链路通。
#
#   .venv/bin/python -m src.app.eval.cli --dataset datasets/smoke-webui.yaml \
#     --release webui-smoke --no-judge

name: smoke-webui
description: Web-UI 自动化智能体冒烟（1 条：确认 agent 能驱动 playwright runner）
agent: webui_agent

items:
  - id: runner-001
    input: >-
      先检查 Playwright 执行器是否在线。然后对 https://m.douban.com/movie/ 写一条最小
      Playwright 用例：打开首页、断言页面标题包含「豆瓣电影」，并截一张图存到 artifacts/。
      执行它，然后告诉我：执行器的 CLI 版本是什么、用例通过还是失败、截图文件名是什么。
    expected:
      contains: ['豆瓣']
      tools: { sequence: [webui_run_spec], mode: subsequence }
    judge:
      criteria: >-
        回答必须给出执行器的真实 CLI 版本（形如 1.56.x）、用例的执行结果、
        以及截图文件名。必须真实调用过 webui_run_spec；只描述步骤而无执行证据判不通过。
      pass: 0.6
